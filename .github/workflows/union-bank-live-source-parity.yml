name: Union Bank Live Source Parity Preview

on:
  workflow_dispatch:
  push:
    branches: ["sync/latest-local-changes-2026-10-23"]
    paths:
      - "backend/parsers/union_bank_parser.js"
      - "backend/review/union_bank_official_baseline_2026-08-04.json"
      - "backend/scripts/verify_union_bank_live_source.js"
      - ".github/workflows/union-bank-live-source-parity.yml"

permissions:
  contents: read

jobs:
  live-source-parity:
    name: Verify callable regular table without staging or promotion
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Fetch Union Bank official page and compare all callable regular rows
        run: node scripts/verify_union_bank_live_source.js
      - name: Upload raw page and parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: union-bank-live-source-evidence
          path: backend/review/live-evidence/
          if-no-files-found: warn
          retention-days: 14
